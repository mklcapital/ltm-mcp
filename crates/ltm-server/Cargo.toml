[package]
name = "ltm-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ltm-mcp"
path = "src/main.rs"

[dependencies]
ltm-core.workspace = true
ltm-db.workspace = true
ltm-embed.workspace = true
ltm-rerank.workspace = true
ltm-tools.workspace = true
serde_json.workspace = true
rmcp = { version = "3", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
subtle = "2"
base64 = "0.22"
